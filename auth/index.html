
<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Firezone Account</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="fire-bg"></div>

<div class="auth-box">
<img src="../assets/logo.jpg" class="logo">
<h1>FIREZONE TEAM</h1>
<p class="sub">ACCOUNT SYSTEM</p>

<div class="tabs">
<button onclick="show('login')">Войти</button>
<button onclick="show('register')">Регистрация</button>
</div>

<div id="login">
<input id="loginUser" placeholder="Логин">
<input id="loginPass" type="password" placeholder="Пароль">
<button class="main" onclick="login()">Войти</button>
</div>

<div id="register" hidden>
<input id="regUser" placeholder="Логин">
<input id="regPass" type="password" placeholder="Пароль">
<input id="regNick" placeholder="Ник команды">
<button class="main" onclick="register()">Создать аккаунт</button>
</div>

<p id="msg"></p>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
