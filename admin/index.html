
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=.0">
  <title>Firezone Admin</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body{padding:8px}
    .admin-wrap{width:min(80px,00%);margin:0 auto}
    .admin-grid{display:grid;grid-template-columns:fr fr;gap:8px}
    .admin-form{padding:px}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
    input,textarea{
      width:00%;padding:4px 6px;border-radius:6px;border:px solid rgba(55,0,0,.);
      background:rgba(55,55,55,.0);color:#fff;outline:none
    }
    textarea{min-height:0px;resize:vertical}
    .form-btn{
      padding:4px 8px;border-radius:6px;border:none;background:linear-gradient(80deg,#db00,#7e0000);
      color:#fff;font-weight:700;cursor:pointer;box-shadow:0 0 px rgba(55,0,0,.)
    }
    .helper{font-size:px;color:#c8c8cd;line-height:.6}
    .admin-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
    .admin-top a{color:#fff;text-decoration:none}
    .preview-note{margin-top:px;color:#ff9090;font-size:px}
    @media(max-width:900px){.admin-grid{grid-template-columns:fr}}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-top panel" style="padding:0px px;">
      <div>
        <div class="section-kicker">CONTROL</div>
        <h style="margin-top:4px;">Firezone Admin Panel</h>
        <div class="helper">Все данные сохраняются в localStorage этого браузера и сразу отображаются на сайте.</div>
      </div>
      <a class="action-btn action-secondary" href="../index.html">Назад на сайт</a>
    </div>

    <div class="admin-grid">
      <section class="panel admin-form">
        <div class="section-kicker">PLAYER</div>
        <h>Добавить игрока</h>
        <div class="field"><label>Ник</label><input id="playerName"></div>
        <div class="field"><label>Роль</label><input id="playerRole"></div>
        <div class="field"><label>K/D</label><input id="playerKd"></div>
        <div class="field"><label>В команде</label><input id="playerTime"></div>
        <div class="field"><label>История</label><textarea id="playerHistory"></textarea></div>
        <div class="field"><label>Аватар игрока</label><input id="playerAvatar" type="file" accept="image/*"></div>
        <button class="form-btn" id="addPlayerBtn">Сохранить игрока</button>
      </section>

      <section class="panel admin-form">
        <div class="section-kicker">NEWS</div>
        <h>Добавить новость</h>
        <div class="field"><label>Заголовок</label><input id="newsTitle"></div>
        <div class="field"><label>Текст</label><textarea id="newsText"></textarea></div>
        <button class="form-btn" id="addNewsBtn">Сохранить новость</button>
      </section>

      <section class="panel admin-form">
        <div class="section-kicker">MATCH</div>
        <h>Добавить матч</h>
        <div class="field"><label>Соперник</label><input id="matchEnemy"></div>
        <div class="field"><label>Счет</label><input id="matchScore"></div>
        <div class="field"><label>Результат</label><input id="matchResult"></div>
        <div class="field"><label>Турнир / Серия</label><input id="matchEvent"></div>
        <button class="form-btn" id="addMatchBtn">Сохранить матч</button>
      </section>

      <section class="panel admin-form">
        <div class="section-kicker">SETTINGS</div>
        <h>Настройки сайта</h>
        <div class="field"><label>Подзаголовок на главной</label><input id="heroText"></div>
        <div class="field"><label>Telegram</label><input id="telegramLink"></div>
        <div class="field"><label>Код владельца</label><input id="leaderCode"></div>
        <div class="field"><label>Фон сайта</label><input id="siteBackground" type="file" accept="image/*"></div>
        <div class="preview-note">Фон и все добавленные данные сохраняются локально в браузере.</div>
        <button class="form-btn" id="saveSettingsBtn">Сохранить настройки</button>
      </section>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
